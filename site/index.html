<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambassador Floor TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
:root{
  /* Ambassador wall display: deep-teal room, slow brand light drifting behind glassy tiles; teal header band with cyan titles; green = wins. Layout: every screen is a hero column + a 3x2 tile grid, header / grid / ticker / status line */
  --teal:#005176; --green:#7AB93D; --cyan:#9DD2DE;
  --bg:#041C28; --panel:rgba(9,46,64,.84); --line:rgba(157,210,222,.17); --ink:#F3FAFC; --ink2:#A7C4CF;
  --s-ok:#8CC63F; --s-pace:#9DD2DE; --s-near:#F2C14E; --s-push:#F29E38; --s-pend:#5D7B88;
  --display:"Century Gothic","Questrial","Avenir Next","Segoe UI",sans-serif;
  --body:"Century Gothic","Questrial","Segoe UI",system-ui,sans-serif;
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
html{font-size:20px}
body.idle{cursor:none}
#app{position:relative;height:100%;z-index:1}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance}

.amb{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:0}
.amb i{position:absolute;display:block;border-radius:50%;will-change:transform}
.amb .o1{width:62vw;height:62vw;left:-16vw;top:-24vw;background:radial-gradient(circle,rgba(0,110,160,.55) 0%,rgba(0,81,118,0) 66%);animation:d1 70s ease-in-out infinite alternate}
.amb .o2{width:52vw;height:52vw;right:-14vw;bottom:-26vw;background:radial-gradient(circle,rgba(122,185,61,.22) 0%,rgba(122,185,61,0) 66%);animation:d2 90s ease-in-out infinite alternate}
.amb .o3{width:40vw;height:40vw;left:38vw;top:28vh;background:radial-gradient(circle,rgba(157,210,222,.13) 0%,rgba(157,210,222,0) 66%);animation:d3 110s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(14vw,12vh)}}
@keyframes d2{to{transform:translate(-16vw,-10vh)}}
@keyframes d3{to{transform:translate(-20vw,14vh)}}

.en{font-size:.74em;color:var(--ink2);font-weight:400;margin-left:.45em;letter-spacing:0;text-transform:none}
.enb{display:block;font-size:.72em;color:var(--ink2);font-weight:400;margin-top:.12em;letter-spacing:.02em;text-transform:none}
.lang-es .en,.lang-es .enb{display:none}

.tv-wrap{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;transition:transform 1s}
.tv-head{position:relative;background:var(--teal);display:flex;align-items:center;justify-content:space-between;padding:.95rem 2rem 1.1rem}
.brand{display:flex;align-items:center;min-width:0}
.brandmark{font-family:var(--display);font-weight:700;letter-spacing:.22em;font-size:1rem;color:#fff;border:2px solid rgba(255,255,255,.6);padding:.45rem .8rem;white-space:nowrap;margin-right:1.6rem}
.brandlogo{display:block;height:4.1rem;width:auto;margin-right:1.9rem;flex:none}
.t-title{font-weight:700;color:var(--cyan);font-size:2.3rem;line-height:1.1}
.t-title .en{color:rgba(255,255,255,.75);font-size:.6em}
.t-sub{color:#fff;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;margin-top:.25rem}
.t-sub .en{color:rgba(255,255,255,.7);letter-spacing:.1em;text-transform:uppercase;font-size:.9em}
.tv-time{text-align:right;white-space:nowrap;margin-left:2rem}
.clk{font-family:var(--display);font-size:2.5rem;font-weight:700;color:#fff;line-height:1.05}
.dt{color:var(--cyan);font-size:1rem}
.dayline{position:absolute;left:0;right:0;bottom:0;height:.22rem;background:rgba(255,255,255,.12)}
.dayline i{display:block;height:100%;background:var(--green);transition:width 2s}
.tv-main{padding:1.2rem 2rem 1rem;min-height:0}

.ticker{display:flex;align-items:stretch;height:2.6rem;background:rgba(3,22,31,.92);border-top:1px solid var(--line)}
.tk-label{display:flex;align-items:center;padding:0 1.2rem 0 2rem;background:var(--green);color:#0B2A12;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.85rem;white-space:nowrap}
.tk-win{position:relative;flex:1;overflow:hidden}
.tk-track{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:nowrap;will-change:transform;animation:tk linear infinite}
.tk-track span{font-size:1.1rem;color:#E3F1F5;padding:0 1.4rem}
.tk-track b{color:var(--cyan);font-weight:700;margin-right:.5rem}
.tk-track i{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--green);vertical-align:middle}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tv-foot{display:flex;justify-content:space-between;padding:.45rem 2rem;background:#020F16;color:var(--ink2);font-size:.8rem}
.live:before{content:"";display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--s-ok);margin-right:.5rem;vertical-align:middle;animation:blink 2.4s ease-in-out infinite}
.live.warn:before{background:var(--s-push)}
@keyframes blink{50%{opacity:.35}}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);grid-gap:1.2rem;height:100%}
.left{display:grid;grid-template-rows:minmax(0,1.7fr) minmax(0,1fr);grid-gap:1.2rem;min-height:0}
.left.one{grid-template-rows:minmax(0,1fr)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));grid-gap:1rem;min-height:0}

.card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.05rem 1.25rem;display:flex;flex-direction:column;min-height:0;transition:transform .9s ease,border-color .9s ease,box-shadow .9s ease}
.card > * + *{margin-top:.55rem}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:.35rem;background:var(--s-pend)}
.card[data-s=ok]:before{background:var(--s-ok)}
.card[data-s=pace]:before,.card[data-s=info]:before{background:var(--s-pace)}
.card[data-s=near]:before{background:var(--s-near)}
.card[data-s=push]:before{background:var(--s-push)}
.card.plain:before{background:var(--teal)}
.card.warm:before{background:var(--green)}
.card[data-s=ok]{border-color:rgba(140,198,63,.45);animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 2.2rem rgba(140,198,63,.22)}}
.card.spot{transform:scale(1.022);border-color:rgba(157,210,222,.75);box-shadow:0 0 2.6rem rgba(157,210,222,.2);z-index:2}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.dname{display:flex;align-items:flex-start;font-family:var(--display);font-size:1.05rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);line-height:1.2}
.dname .enb{letter-spacing:.08em;text-transform:uppercase;font-size:.68em}
.ico{width:1.5rem;height:1.5rem;margin-right:.6rem;flex:none;display:inline-flex;align-items:center;justify-content:center}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.emo{font-family:var(--emoji);font-size:1.35rem;line-height:1;letter-spacing:0}
.ex{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);border:1px dashed rgba(167,196,207,.6);border-radius:99px;padding:.1rem .55rem;white-space:nowrap;margin-left:.6rem}
.mlabel{font-size:1.1rem;color:#D5E7ED;line-height:1.3}
.bigline{display:flex;align-items:baseline}
.big{font-family:var(--display);font-size:4.4rem;font-weight:700;line-height:1}
.of{font-size:1.6rem;color:var(--ink2);margin-left:.35rem}
.bar{position:relative;height:.7rem;background:rgba(255,255,255,.09);border-radius:99px;flex:none}
.bar .fill{height:100%;border-radius:99px;background:var(--s-pend);transition:width 1.2s ease}
.bar[data-s=ok] .fill{background:var(--s-ok)}
.bar[data-s=pace] .fill,.bar[data-s=info] .fill{background:var(--s-pace)}
.bar[data-s=near] .fill{background:var(--s-near)}
.bar[data-s=push] .fill{background:var(--s-push)}
.bar .pm{position:absolute;top:-.3rem;bottom:-.3rem;width:3px;background:#fff;border-radius:2px}
.pill{display:inline-block;padding:.22rem .8rem;border-radius:12px;font-size:.95rem;font-weight:700;line-height:1.25;background:rgba(255,255,255,.08);color:#A9BEC6}
.pill .enb{color:inherit;opacity:.8;font-size:.78em}
.pill[data-s=ok]{background:rgba(140,198,63,.22);color:#BEE58C}
.pill[data-s=pace]{background:rgba(157,210,222,.18);color:#C3E8EF}
.pill[data-s=near]{background:rgba(242,193,78,.18);color:#F6D586}
.pill[data-s=push]{background:rgba(242,158,56,.2);color:#F8BF7A}
.sec{font-size:.98rem;color:#D5E7ED;border-top:1px solid var(--line);padding-top:.5rem;line-height:1.3}
.secv{display:block;font-weight:700;font-size:1.2rem;margin-top:.15rem}
.secv[data-s=ok]{color:#BEE58C}.secv[data-s=near]{color:#F6D586}.secv[data-s=push]{color:#F8BF7A}
.upd{margin-top:auto !important;font-size:.8rem;color:#7E9EAB}
.phrase{margin-top:auto !important;font-size:1.15rem;line-height:1.4;color:#E6F3F6}
.phrase .enb{font-size:.82em;margin-top:.3em}
.greet{font-family:var(--display);font-size:1.75rem;font-weight:700;line-height:1.15}

.ringrow{display:flex;align-items:center}
.ring{position:relative;flex:none;margin-right:1.1rem}
.ring.lg{width:11rem;height:11rem;margin-right:1.4rem}
.ring.sm{width:6.5rem;height:6.5rem}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.09)}
.ring .fg{stroke:var(--s-pace);stroke-linecap:round;transition:stroke-dashoffset 1.6s ease}
.ring .tick{fill:#fff;stroke:none}
.ring[data-s=ok] .fg{stroke:var(--s-ok)}.ring[data-s=push] .fg{stroke:var(--s-push)}.ring[data-s=near] .fg{stroke:var(--s-near)}.ring[data-s=pend] .fg{stroke:var(--s-pend)}
.ring .num{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .num b{font-family:var(--display);line-height:1}
.ring.lg .num b{font-size:3.9rem}
.ring.sm .num b{font-size:2.3rem}
.ring .num small{font-size:.72rem;color:var(--ink2);margin-top:.15rem;max-width:80%;line-height:1.15}
.ring.lg .num small{font-size:.95rem}
.side-info > * + *{margin-top:.5rem}

.mrow{display:flex;flex-direction:column}
.mrow + .mrow{margin-top:.6rem}
.mrow-l{font-size:.98rem;color:#D5E7ED;line-height:1.25}
.mrow-v{font-family:var(--display);font-size:1.45rem;font-weight:700;margin:.05rem 0 .25rem}
.mrow-v small{font-family:var(--body);font-size:.78rem;font-weight:400;color:var(--ink2);margin-left:.4rem}
.mrow-v[data-s=ok]{color:#BEE58C}.mrow-v[data-s=near]{color:#F6D586}.mrow-v[data-s=push]{color:#F8BF7A}.mrow-v[data-s=pend]{color:#7E9EAB}
.list{list-style:none;margin:0;padding:0}
.list li{font-size:1.08rem;line-height:1.3;display:flex;align-items:flex-start}
.list li + li{margin-top:.55rem}
.list .lk{flex:none;width:1.6rem;margin-right:.55rem;text-align:center;color:var(--cyan)}
.list .lk .ico{width:1.2rem;height:1.2rem;margin:0}
.list .lk .emo{font-size:1.15rem}
.list small{display:block;color:var(--ink2);font-size:.85rem}
.list .when{color:var(--green);font-weight:700}
.empty{color:var(--ink2);font-size:1.05rem;line-height:1.4}
.cmp{display:inline-block;white-space:nowrap;font-family:var(--body);font-size:.74rem;font-weight:700;margin-left:.45rem;padding:.08rem .45rem;border-radius:6px;background:rgba(255,255,255,.07);color:var(--ink2);vertical-align:middle;animation:fadein .6s ease}
.cmp em{font-style:normal;font-weight:400;color:var(--ink2);margin-left:.25rem}
.cmp[data-g=good]{color:#BEE58C}.cmp[data-g=bad]{color:#F8BF7A}
.cmp-y{display:none}
body.cmp-yoy .cmp-m{display:none}
body.cmp-yoy .cmp-y{display:inline-block}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.recap{margin-top:auto !important;border-top:1px solid var(--line);padding-top:.55rem}
.recap-h{font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:.35rem}
.recap-h .en{text-transform:uppercase;letter-spacing:.08em}
.rrow{display:flex;align-items:center;font-size:.95rem;line-height:1.2}
.rrow + .rrow{margin-top:.35rem}
.rl{width:9.5rem;flex:none;color:#D5E7ED}
.rbar{flex:1;height:.7rem;background:rgba(255,255,255,.08);border-radius:99px;margin:0 .7rem;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:99px;background:rgba(157,210,222,.55);transition:width 1.2s ease}
.rrow.now .rbar i{background:var(--s-ok)}
.rrow b{font-family:var(--display);min-width:2.6rem;text-align:right}
.rnote{display:block;color:#7E9EAB;font-size:.72rem;margin-top:.35rem}
.ring.md{width:9rem;height:9rem}
.grid.g2{grid-template-rows:minmax(0,1fr) minmax(0,1.32fr)}
.g2 .card{padding:.9rem 1.1rem}
.g2 .card > * + *{margin-top:.45rem}
.g2 .mrow-l{font-size:.9rem}
.g2 .mrow-v{font-size:1.3rem;margin:0 0 .2rem}
.g2 .bar{height:.55rem}
.g2 .mrow + .mrow{margin-top:.45rem}
.ring.md .num b{font-size:3.1rem}
.word{font-family:var(--display);font-size:2.3rem;font-weight:700;line-height:1.05;color:#fff}
.word-t{font-size:1.35rem;color:var(--cyan);font-weight:700}
.ex-s{font-size:.98rem;line-height:1.4;color:#D5E7ED}
.ex-s i{display:block;font-style:normal;color:var(--ink2);font-size:.9em;margin-top:.2rem}
.lead{font-size:1.25rem;line-height:1.4;color:#EAF5F8}
.lead .enb{font-size:.82em;margin-top:.35em}
.bigemo{font-family:var(--emoji);font-size:3rem;line-height:1}
.style-sobrio .bigemo{display:none}
.feat-wrap{display:flex;min-height:0}
.feat{flex:1 1 auto;position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:2rem 2.2rem;display:flex;flex-direction:column;justify-content:center}
.feat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:.55rem;background:var(--s-ok)}
.feat[data-g=info]:before{background:var(--cyan)}
.feat .k{position:absolute;left:2.2rem;top:1.6rem;right:2.2rem;display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:1.1rem;color:var(--green)}
.feat .k .enb{text-transform:uppercase;letter-spacing:.1em}
.feat[data-g=info] .k{color:var(--cyan)}
.feat .glyph{position:absolute;right:-1rem;bottom:-1.2rem;width:15rem;height:15rem;color:rgba(157,210,222,.09);display:flex;align-items:flex-end;justify-content:flex-end}
.feat .glyph svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.feat .glyph .emo{font-size:9rem;opacity:.9;margin:0 1.6rem 2.4rem 0}
.feat-title{position:relative;font-size:2.7rem;line-height:1.12;font-weight:700;color:#fff}
.feat-body{position:relative;font-size:1.4rem;line-height:1.45;color:#DDEDF2;margin-top:1rem !important}
.feat-en{position:relative;font-size:1.1rem;line-height:1.4;color:var(--ink2);margin-top:.6rem}
.lang-es .feat-en{display:none}
.feat-team{position:relative;font-size:1.15rem;color:var(--cyan);font-weight:700;margin-top:1rem}
.dots{position:absolute;left:2.2rem;bottom:1.4rem;display:flex;flex-wrap:wrap;max-width:60%}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:rgba(255,255,255,.2);margin:0 .45rem .3rem 0}
.dot.on{background:var(--cyan)}

.in{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(1.2rem)}to{opacity:1;transform:none}}
.wait{display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.wait h2{font-size:2.6rem;color:var(--cyan)}
.wait p{font-size:1.3rem;color:var(--ink2);max-width:40ch;margin-top:1rem}
canvas.cf{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}

.ov{position:fixed;right:1.2rem;bottom:4.2rem;display:flex;flex-wrap:wrap;justify-content:flex-end;background:rgba(3,22,31,.94);border:1px solid var(--line);border-radius:12px;padding:.5rem;transition:opacity .3s;z-index:6;font-size:14px}
body.idle .ov{opacity:0;pointer-events:none}
.ovb{font:inherit;font-size:14px;color:#fff;background:transparent;border:1px solid rgba(157,210,222,.4);border-radius:8px;padding:6px 12px;text-decoration:none;cursor:pointer;margin:3px}
.ovb.on{background:var(--teal);border-color:var(--teal)}
.ovb:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.foto *,.foto *:before,.foto *:after{animation:none!important;transition:none!important}
/* ---- season theme: Christmas (data-theme=navidad on <html>) ---- */
.xg{position:absolute;left:0;top:calc(100% - .7rem);width:100%;height:auto;display:block;z-index:4;pointer-events:none;overflow:visible}
.xg .xw{fill:none;stroke:#0E3A24;stroke-width:2.4}
.xg .xn{stroke:#2F7A3E;stroke-width:2.2;stroke-linecap:round}
.xg .xn2{stroke:#4C9A4F;stroke-width:1.8;stroke-linecap:round}
.xg .xh{fill:#3A4A50}
.xg .xs{fill:#fff;opacity:.55}
.xg .xr{fill:#D7262E}
.xg .xglow{opacity:.32}
.xg .xglow.t0{animation:xtw 2.6s ease-in-out infinite}
.xg .xglow.t1{animation:xtw 2.6s ease-in-out -.65s infinite}
.xg .xglow.t2{animation:xtw 2.6s ease-in-out -1.3s infinite}
.xg .xglow.t3{animation:xtw 2.6s ease-in-out -1.95s infinite}
@keyframes xtw{0%,100%{opacity:.12}50%{opacity:.7}}
html[data-theme=navidad] .amb .o2{background:radial-gradient(circle,rgba(215,38,46,.20) 0%,rgba(215,38,46,0) 66%)}
html[data-theme=navidad] .amb .o3{background:radial-gradient(circle,rgba(242,193,78,.12) 0%,rgba(242,193,78,0) 66%)}
.xsnow{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:6}
.foto .xsnow{display:none}
.video .ov{display:none!important}
.video .clk{visibility:hidden!important}
.video .amb i{animation:none!important}
.video .xg .xglow.t0{animation-duration:3s;animation-delay:0s}
.video .xg .xglow.t1{animation-duration:3s;animation-delay:-.75s}
.video .xg .xglow.t2{animation-duration:3s;animation-delay:-1.5s}
.video .xg .xglow.t3{animation-duration:3s;animation-delay:-2.25s}
.dname{position:relative}
.shat{position:absolute;left:-.55rem;top:-.95rem;width:1.75rem;height:auto;transform:rotate(-22deg);pointer-events:none;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.feat .shat{display:none}
.foto .ov{display:none!important}
.foto .clk{visibility:hidden!important}
.foto .tk-track{transform:none!important}
.card{isolation:isolate}
.wm{position:absolute;right:-1.4rem;bottom:-1.6rem;width:10rem;height:10rem;color:rgba(157,210,222,.075);z-index:-1;pointer-events:none}
.wm svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.g2 .wm{width:8rem;height:8rem;right:-1rem;bottom:-1.2rem}
.spark{display:block;width:100%;height:3.5rem;margin-top:.55rem !important;overflow:visible}
.spark.sm{height:2.6rem;margin-top:.4rem !important}
.card.dept > * + *{margin-top:.45rem}
.card.dept .sec{padding-top:.4rem}
.spark text{font-family:var(--body)}

  if(idx===2) return [[cap(fmtNow('es-SV',{month:'long',year:'numeric'})),fmtNow('en-US',{month:'long',year:'numeric'})],['Metas del mes','Monthly goals']];
  return [['Nuestra gente','Our people'],['Reconocimiento, aprendizaje y bienestar','Recognition, learning and wellbeing']];
}
function lbl(es,en){if(lang()==='es') return es;var p=pair(es,en);return p[0]+' · '+p[1];}
function tickerItems(){
  var items=[],es=lang()==='es',si=seasonItem();if(si) items.push(si);
  activePosts().forEach(function(p){var t=PTYPES[p.type],pn=personOf(p);items.push([lbl(t.label,t.en),(pn?pn+' · ':'')+str(p.title,90)]);});
  goalsMet().forEach(function(x){items.push([lbl('Meta cumplida','Goal met'),tt(x.d.name,x.d.en||x.d.name)+' · '+tt(x.m.label,x.m.en)]);});
  var c=comingUp(1)[0];if(c){var w=whenLabel(c.days);items.push([lbl('Próximamente','Coming up'),tt(c.es,c.en)+' ('+tt(w[0],w[1])+')']);}
  var rc=recapStory();if(rc) items.push([lbl('Recap del mes','Monthly recap'),tt(rc.title,rc.titleEn)]);
  var wd=WORDS[doy()%WORDS.length];items.push([lbl('Palabra del día','Word of the day'),wd[0]+' = '+wd[1]]);
  var ph=phrase(),pp=pair(ph[0],ph[1]);items.push([lbl('Frase del día','Quote of the day'),pp[0]+(es?'':'  /  '+pp[1])]);
  var b=cfg().banner;if(b) items.push([tt('Mensaje','Message'),b]);
  return items;
}
function buildTicker(){
  var items=tickerItems(),key=JSON.stringify(items)+cfg().style;
  if(els.tkKey===key) return; els.tkKey=key;
  var track=h('div',{class:'tk-track'});
  for(var r=0;r<2;r++) items.forEach(function(it){track.appendChild(h('span',null,h('b',null,it[0]),it[1]));track.appendChild(h('i'));});
  track.style.animationDuration=(VIDEO()?60:Math.max(40,Math.round(key.length*0.2)))+'s';
  els.tkWin.innerHTML='';els.tkWin.appendChild(track);
}
function liveLine(){
  if(!D) return h('span',{class:'live warn'},tt('Esperando los datos de los equipos','Waiting for team data'));
  var g=D.generatedAt?Date.parse(D.generatedAt):0,age=g?(Date.now()-g)/36e5:99,n=nowSV(),c=cfg();
  return h('span',{class:'live'+(age>3&&n.hours>=c.dayStart+1&&n.hours<=c.dayEnd?' warn':'')},tt('Datos actualizados ','Data updated ')+(g?timeOf(D.generatedAt):'—'));
}
function frame(){
  els.title=h('h1',{class:'t-title'});els.sub=h('div',{class:'t-sub'});
  els.clk=h('div',{class:'clk'});els.dt=h('div',{class:'dt'});els.dayfill=h('i');
  els.main=h('main',{class:'tv-main'});els.tkWin=h('div',{class:'tk-win'});els.live=h('span');els.foot=h('span');els.tkKey='';
  els.wrap=h('div',{class:'tv-wrap'},
    h('header',{class:'tv-head'},h('div',{class:'brand'},h('img',{class:'brandlogo',src:LOGO,alt:'Ambassador Services'}),h('div',null,els.title,els.sub)),h('div',{class:'tv-time'},els.clk,els.dt),h('div',{class:'dayline'},els.dayfill)),
    els.main,
    h('div',{class:'ticker'},h('div',{class:'tk-label'},tt('Al día','Today')),els.tkWin),
    h('footer',{class:'tv-foot'},els.live,els.foot));
  while(app.firstChild) app.removeChild(app.firstChild);
  app.appendChild(els.wrap);app.appendChild(overlay());
}
function header(idx){
  var t=titles(idx);
  var a=pair(t[0][0],t[0][1]),b=pair(t[1][0],t[1][1]);
  els.title.innerHTML='';els.title.appendChild(document.createTextNode(a[0]));els.title.appendChild(h('span',{class:'en'},a[1]));
  els.sub.innerHTML='';els.sub.appendChild(document.createTextNode(b[0]));els.sub.appendChild(h('span',{class:'en'},'· '+b[1]));
  els.clk.textContent=clock();els.dt.textContent=longDate();
  els.dayfill.style.width=(dayFrac()*100).toFixed(1)+'%';
  els.live.innerHTML='';els.live.appendChild(liveLine());
  els.foot.textContent=(D&&anySample()?tt('Números de ejemplo donde un equipo aún no reporta','Sample numbers where a team hasn’t reported yet')+' · ':'')+'Ambassador Services · El Salvador · '+tt('Pantalla ','Screen ')+idx+tt(' de 3',' of 3');
}
function countUp(root){
  var nodes=root.querySelectorAll('[data-count]'),t0=null,dur=1100;
  var list=Array.prototype.map.call(nodes,function(n){return {n:n,to:Number(n.getAttribute('data-count')),pct:n.getAttribute('data-pct')==='1',dec:String(n.getAttribute('data-count')).indexOf('.')>-1}});
  list.forEach(function(x){x.n.textContent=x.pct?'0%':'0';});
  function step(ts){if(t0==null)t0=ts;var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3);
    list.forEach(function(x){var v=x.to*e;var s=x.dec?nf.format(Math.round(v*10)/10):nf.format(Math.round(v));x.n.textContent=x.pct?s+'%':s;});
    if(p<1) requestAnimationFrame(step); else list.forEach(function(x){x.n.textContent=x.pct?nf.format(x.to)+'%':nf.format(x.to);});}
  requestAnimationFrame(step);
  Array.prototype.forEach.call(root.querySelectorAll('.bar .fill[data-w]'),function(f){var w=f.getAttribute('data-w');f.style.width='0%';setTimeout(function(){f.style.width=w+'%';},60);});
  Array.prototype.forEach.call(root.querySelectorAll('.ring .fg'),function(c){var C=c.getAttribute('data-c'),o=c.getAttribute('data-off');c.style.strokeDashoffset=C;setTimeout(function(){c.style.strokeDashoffset=o;},60);});
}
function stagger(root){Array.prototype.forEach.call(root.querySelectorAll('.card,.feat'),function(c,i){c.classList.add('in');c.style.animationDelay=(i*0.07).toFixed(2)+'s';setTimeout(function(){c.classList.remove('in');c.style.animationDelay='';},900+i*70);});}
function confetti(){
  if(!vivo()||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  var cv=h('canvas',{class:'cf','aria-hidden':'true'});document.body.appendChild(cv);
  var W=cv.width=window.innerWidth,H=cv.height=window.innerHeight,ctx=cv.getContext('2d');if(!ctx){cv.parentNode.removeChild(cv);return;}
  var cols=['#7AB93D','#9DD2DE','#FFFFFF','#F2C14E','#8CC63F'],ps=[];
  for(var i=0;i<110;i++) ps.push({x:Math.random()*W,y:-Math.random()*H*0.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3.5,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:cols[i%cols.length]});
  var t0=null;
  function f(ts){if(t0==null)t0=ts;var el=ts-t0;ctx.clearRect(0,0,W,H);ctx.globalAlpha=el>2400?Math.max(0,1-(el-2400)/700):1;
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(el<3100) requestAnimationFrame(f); else if(cv.parentNode) cv.parentNode.removeChild(cv);}
  requestAnimationFrame(f);
}
/* ---------- season theme: Christmas ----------
   On by itself from Nov 15 to Jan 6 (El Salvador date). settings.theme 'navidad' forces it on, 'normal' forces it off.
   The garland's bulbs (.xb) are read by render.py so the Roku app can make them twinkle on the TVs. */
function xmasOn(){var t=D&&D.settings&&D.settings.theme;if(t==='navidad') return true;if(t==='normal') return false;var n=nowSV();return (n.m===11&&n.d>=15)||n.m===12||(n.m===1&&n.d<=6);}
var XCOL=['#E5484D','#F2C14E','#7AB93D','#9DD2DE','#F7F3E8'];
function garland(){
  var ns='http://www.w3.org/2000/svg',W=1920,SEG=8,sw=W/SEG,TOP=4,CTRL=30,BULBS=[0.13,0.32,0.5,0.68,0.87],k=0;
  function el(n,a){var e=document.createElementNS(ns,n);for(var x in a) e.setAttribute(x,a[x]);return e;}
  var svg=el('svg',{class:'xg',viewBox:'0 0 1920 56','aria-hidden':'true'}),glows=el('g',{}),wire=el('g',{}),bulbs=el('g',{}),sprigs=el('g',{});
  for(var i=0;i<SEG;i++){
    var x0=i*sw,x1=x0+sw,cx=x0+sw/2;
    wire.appendChild(el('path',{class:'xw',d:'M'+x0+' '+TOP+' Q'+cx+' '+CTRL+' '+x1+' '+TOP}));
    BULBS.forEach(function(t){
      var x=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1,y=(1-t)*(1-t)*TOP+2*(1-t)*t*CTRL+t*t*TOP,c=XCOL[k%XCOL.length],by=y+11.5;
      glows.appendChild(el('circle',{class:'xglow t'+(k%4),cx:x.toFixed(1),cy:by.toFixed(1),r:'13',fill:c}));
      bulbs.appendChild(el('rect',{class:'xh',x:(x-3).toFixed(1),y:(y-1).toFixed(1),width:'6',height:'5',rx:'1'}));
      bulbs.appendChild(el('ellipse',{class:'xb','data-c':c,'data-g':String(k%4),cx:x.toFixed(1),cy:by.toFixed(1),rx:'5.2',ry:'7.6',fill:c}));
      bulbs.appendChild(el('ellipse',{class:'xs',cx:(x-1.7).toFixed(1),cy:(by-2.6).toFixed(1),rx:'1.4',ry:'2.4'}));
      k++;});
  }
  for(var j=0;j<=SEG;j++){
    var hx=Math.min(W-14,Math.max(14,j*sw)),g=el('g',{transform:'translate('+hx+' '+TOP+')'});
    [[-26,-2],[-20,7],[-12,11],[-4,12],[4,12],[12,11],[20,7],[26,-2],[-17,-6],[17,-6],[-8,-7],[8,-7]].forEach(function(v,n){g.appendChild(el('line',{class:n%2?'xn2':'xn',x1:'0',y1:'0',x2:String(v[0]),y2:String(v[1])}));});
    g.appendChild(el('circle',{class:'xr',cx:'-3',cy:'4',r:'3.4'}));g.appendChild(el('circle',{class:'xr',cx:'3.5',cy:'5',r:'3.4'}));
    sprigs.appendChild(g);
  }
  svg.appendChild(glows);svg.appendChild(wire);svg.appendChild(bulbs);svg.appendChild(sprigs);
  return svg;
}
function snowfall(){
  if(FOTO()||VIDEO()||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return null;
  var cv=h('canvas',{class:'xsnow','aria-hidden':'true'}),ctx=cv.getContext&&cv.getContext('2d');if(!ctx) return null;
  var W,H,fl=[];function size(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}size();window.addEventListener('resize',size);
  for(var i=0;i<46;i++) fl.push({x:Math.random(),y:Math.random(),r:1.2+Math.random()*2.6,v:.00025+Math.random()*.0005,ph:Math.random()*6.3,a:.35+Math.random()*.45});
  function f(ts){if(!cv.parentNode) return;ctx.clearRect(0,0,W,H);
    fl.forEach(function(p){p.y+=p.v;if(p.y>1.02){p.y=-.02;p.x=Math.random();}var x=(p.x+Math.sin(ts/2600+p.ph)*.008)*W;ctx.globalAlpha=p.a;ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(x,p.y*H,p.r,0,6.283);ctx.fill();});
    requestAnimationFrame(f);}
  requestAnimationFrame(f);return cv;
}
function seasonDeco(){
  var on=xmasOn();document.documentElement.setAttribute('data-theme',on?'navidad':'');
  var head=els.wrap&&els.wrap.querySelector('.tv-head');if(!head) return;
  var g=head.querySelector('.xg');
  if(on&&!g) head.appendChild(garland());
  if(!on&&g) head.removeChild(g);
  if(on&&!els.snow){els.snow=snowfall();if(els.snow) document.body.appendChild(els.snow);}
  if(!on&&els.snow){if(els.snow.parentNode) els.snow.parentNode.removeChild(els.snow);els.snow=null;}
}
function addHats(root){
  if(!xmasOn()) return;var ns='http://www.w3.org/2000/svg';
  Array.prototype.forEach.call(root.querySelectorAll('.card h2.dname'),function(h2){
    if(h2.querySelector('.shat')) return;
    var svg=document.createElementNS(ns,'svg');svg.setAttribute('class','shat');svg.setAttribute('viewBox','0 0 40 34');svg.setAttribute('aria-hidden','true');
    svg.innerHTML='<path d="M6 26C8 14 16 6 29 4c-2.5 6-.5 14 5 22Z" fill="#D7262E"/><path d="M20 9c4-3 7-4 9-5-2.5 6-.5 14 5 22h-6c-2-7-4-12-8-17Z" fill="#A9161E" opacity=".55"/><rect x="2.5" y="22.5" width="35" height="8.5" rx="4.2" fill="#F7F3E8"/><circle cx="30" cy="5" r="4.4" fill="#F7F3E8"/>';
    h2.insertBefore(svg,h2.firstChild);
  });
}
function seasonItem(){
  if(!xmasOn()) return null;var n=nowSV(),dd;
  if(n.m===12&&n.d<25){dd=25-n.d;return [lbl('Navidad','Christmas'),dd===1?tt('¡Mañana es Navidad!','Christmas is tomorrow!'):tt('Faltan '+dd+' días','Only '+dd+' days to go')];}
  if(n.m===12&&n.d===25) return [lbl('Navidad','Christmas'),tt('¡Feliz Navidad, equipo!','Merry Christmas, team!')];
  if(n.m===12) {dd=32-n.d;return [lbl('Año Nuevo','New Year'),dd===1?tt('¡Mañana empieza el año!','The new year starts tomorrow!'):tt('Faltan '+dd+' días','Only '+dd+' days to go')];}
  if(n.m===1) return [lbl('Año Nuevo','New Year'),tt('¡Feliz Año Nuevo, equipo!','Happy New Year, team!')];
  dd=Math.round((Date.UTC(n.y,11,25)-Date.UTC(n.y,n.m-1,n.d))/864e5);
  return [lbl('Navidad','Christmas'),tt('Faltan '+dd+' días · ¡Felices fiestas!','Only '+dd+' days to go · Happy holidays!')];
}
function applyPrefs(){var c=cfg();document.body.className=(document.body.className.replace(/\b(style-\w+|lang-\w+|foto|video)\b/g,'')+' style-'+c.style+' lang-'+(c.lang==='es'?'es':'bi')+(FOTO()?' foto':'')+(VIDEO()?' video':'')).replace(/\s+/g,' ').trim();}
function render(entry){
  applyPrefs();
  var idx=screenIdx();
  if(!els.wrap) frame();
  header(idx);
  seasonDeco();
  var node;
  if(!D) node=h('div',{class:'wait'},h('h2',null,tt('Preparando las pantallas','Getting the screens ready')),h('p',null,tt('Los números del día aparecerán aquí en cuanto se publique la primera actualización.','Today’s numbers will appear here after the first update.')));
  else node=idx===1?screen1():idx===2?screen2():screen3();
  while(els.main.firstChild) els.main.removeChild(els.main.firstChild);
  els.main.appendChild(node);
  if(idx===3&&D) cur.feat=featured().key;
  addWatermarks(node);
  addHats(node);
  applySpot();
  buildTicker();
  if(entry&&!FOTO()){stagger(node);countUp(node);if(D&&node.querySelector('.card[data-s=ok]')) setTimeout(confetti,700);}
  else Array.prototype.forEach.call(node.querySelectorAll('.feat.in'),function(x){x.classList.remove('in')});
}
function applySpot(){
  var cards=els.main?els.main.querySelectorAll('.card.dept'):[];if(!cards.length||FOTO()) return;
  var i=Math.floor(Date.now()/15000)%cards.length;
  Array.prototype.forEach.call(cards,function(c,j){if(j===i) c.classList.add('spot'); else c.classList.remove('spot');});
}
function overlay(){
  return h('nav',{class:'ov','aria-label':'Controles de pantalla'},
    [['pantalla-1','Pantalla 1'],['pantalla-2','Pantalla 2'],['pantalla-3','Pantalla 3'],['rotar','Rotar']].map(function(x){return h('a',{href:'#'+x[0],class:'ovb','data-v':x[0]},x[1])}),
    h('button',{type:'button',class:'ovb',onclick:function(){
      var p;try{p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){p=null;}
      if(p&&p.catch) p.catch(function(){});
      try{if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){});}catch(e){}
    }},'Pantalla completa'));
}
function markNav(){var v=view();Array.prototype.forEach.call(document.querySelectorAll('.ovb[data-v]'),function(a){if(a.getAttribute('data-v')===v) a.classList.add('on'); else a.classList.remove('on');});}
function fitFont(){document.documentElement.style.fontSize=Math.max(6,Math.min(window.innerWidth*0.0104,window.innerHeight*0.0185,44)).toFixed(2)+'px';}

/* ---------- loop ---------- */
fitFont();
window.addEventListener('resize',fitFont);
window.addEventListener('hashchange',function(){cur.idx=screenIdx();render(true);markNav();});
cur.idx=screenIdx();render(true);markNav();
setInterval(function(){
  var idx=screenIdx(),n=nowSV(),minute=n.date+' '+Math.floor(n.hours*60);
  if(idx!==cur.idx){cur.idx=idx;cur.minute=minute;render(true);return;}
  if(minute!==cur.minute){cur.minute=minute;render(false);return;}
  if(idx===3&&D){var f=featured();if(f.key!==cur.feat){cur.feat=f.key;var slot=document.getElementById('featslot');if(slot){while(slot.firstChild) slot.removeChild(slot.firstChild);slot.appendChild(f.node);}}}
  applySpot();
  var yoy=!FOTO()&&Math.floor(Date.now()/10000)%2===1;if(yoy!==document.body.classList.contains('cmp-yoy')){if(yoy) document.body.classList.add('cmp-yoy'); else document.body.classList.remove('cmp-yoy');}
  if(els.clk) els.clk.textContent=clock();
},1000);
var shift=0;
setInterval(function(){if(FOTO()||VIDEO()) return;shift=(shift+1)%4;var o=[[0,0],[2,1],[1,-2],[-2,1]][shift];if(els.wrap) els.wrap.style.transform='translate('+o[0]+'px,'+o[1]+'px)';},180000);
var idleT=null;
function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.add('idle');},4000);}
['mousemove','keydown','touchstart'].forEach(function(ev){window.addEventListener(ev,wake,{passive:true});});
wake();
})();
</script>
