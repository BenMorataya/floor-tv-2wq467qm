<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Make the GitHub runner draw the TV page with the same fonts as before: Inter for text, Noto Color Emoji for emoji. -->
<fontconfig>
  <alias binding="strong"><family>Century Gothic</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Questrial</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Avenir Next</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="strong"><family>Apple Color Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
